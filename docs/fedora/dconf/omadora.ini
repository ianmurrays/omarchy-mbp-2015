# GNOME keyboard shortcuts for the Omarchy features. See docs/omarchy-features.md.
# Apply: dconf load / < dconf/omadora.ini

[org/gnome/settings-daemon/plugins/media-keys]
custom-keybindings=['/org/gnome/settings-daemon/plugins/media-keys/custom-keybindings/omadora-menu/', '/org/gnome/settings-daemon/plugins/media-keys/custom-keybindings/omadora-apps/', '/org/gnome/settings-daemon/plugins/media-keys/custom-keybindings/omadora-system/', '/org/gnome/settings-daemon/plugins/media-keys/custom-keybindings/omadora-keybindings/', '/org/gnome/settings-daemon/plugins/media-keys/custom-keybindings/omadora-emoji/', '/org/gnome/settings-daemon/plugins/media-keys/custom-keybindings/omadora-clipboard/', '/org/gnome/settings-daemon/plugins/media-keys/custom-keybindings/omadora-calculator/', '/org/gnome/settings-daemon/plugins/media-keys/custom-keybindings/omadora-activity/', '/org/gnome/settings-daemon/plugins/media-keys/custom-keybindings/omadora-sound/', '/org/gnome/settings-daemon/plugins/media-keys/custom-keybindings/omadora-bluetooth/', '/org/gnome/settings-daemon/plugins/media-keys/custom-keybindings/omadora-wifi/', '/org/gnome/settings-daemon/plugins/media-keys/custom-keybindings/omadora-display/', '/org/gnome/settings-daemon/plugins/media-keys/custom-keybindings/omadora-power/', '/org/gnome/settings-daemon/plugins/media-keys/custom-keybindings/omadora-nightlight/', '/org/gnome/settings-daemon/plugins/media-keys/custom-keybindings/omadora-idle/', '/org/gnome/settings-daemon/plugins/media-keys/custom-keybindings/omadora-reminder-set/', '/org/gnome/settings-daemon/plugins/media-keys/custom-keybindings/omadora-reminder-show/', '/org/gnome/settings-daemon/plugins/media-keys/custom-keybindings/omadora-reminder-clear/', '/org/gnome/settings-daemon/plugins/media-keys/custom-keybindings/omadora-time/', '/org/gnome/settings-daemon/plugins/media-keys/custom-keybindings/omadora-battery/', '/org/gnome/settings-daemon/plugins/media-keys/custom-keybindings/omadora-terminal/', '/org/gnome/settings-daemon/plugins/media-keys/custom-keybindings/omadora-browser/', '/org/gnome/settings-daemon/plugins/media-keys/custom-keybindings/omadora-files/', '/org/gnome/settings-daemon/plugins/media-keys/custom-keybindings/omadora-passwords/', '/org/gnome/settings-daemon/plugins/media-keys/custom-keybindings/omadora-agent/']

[org/gnome/settings-daemon/plugins/media-keys/custom-keybindings/omadora-menu]
binding='<Super>space'
command='omadora-menu'
name='Omadora menu'

[org/gnome/settings-daemon/plugins/media-keys/custom-keybindings/omadora-apps]
binding='<Super><Alt>space'
command='vicinae vicinae://toggle'
name='Apps'

[org/gnome/settings-daemon/plugins/media-keys/custom-keybindings/omadora-system]
binding='<Super>Escape'
command='omadora-menu system'
name='System menu'

[org/gnome/settings-daemon/plugins/media-keys/custom-keybindings/omadora-keybindings]
binding='<Super>k'
command='omadora-menu-keybindings'
name='Keybindings'

[org/gnome/settings-daemon/plugins/media-keys/custom-keybindings/omadora-emoji]
binding='<Super><Control>e'
command='vicinae vicinae://launch/core/search-emojis?toggle=true'
name='Emoji picker'

[org/gnome/settings-daemon/plugins/media-keys/custom-keybindings/omadora-clipboard]
binding='<Super><Control>v'
command='vicinae vicinae://launch/clipboard/history?toggle=true'
name='Clipboard history'

[org/gnome/settings-daemon/plugins/media-keys/custom-keybindings/omadora-calculator]
binding='<Super><Control>q'
command='gnome-calculator'
name='Calculator'

[org/gnome/settings-daemon/plugins/media-keys/custom-keybindings/omadora-activity]
binding='<Super><Control>t'
command='ptyxis --new-window -- btop'
name='Activity'

[org/gnome/settings-daemon/plugins/media-keys/custom-keybindings/omadora-sound]
binding='<Super><Control>a'
command='gnome-control-center sound'
name='Sound settings'

[org/gnome/settings-daemon/plugins/media-keys/custom-keybindings/omadora-bluetooth]
binding='<Super><Control>b'
command='gnome-control-center bluetooth'
name='Bluetooth settings'

[org/gnome/settings-daemon/plugins/media-keys/custom-keybindings/omadora-wifi]
binding='<Super><Control>w'
command='gnome-control-center wifi'
name='Wi-Fi settings'

[org/gnome/settings-daemon/plugins/media-keys/custom-keybindings/omadora-display]
binding='<Super><Control>d'
command='gnome-control-center display'
name='Display settings'

[org/gnome/settings-daemon/plugins/media-keys/custom-keybindings/omadora-power]
binding='<Super><Control>p'
command='gnome-control-center power'
name='Power settings'

[org/gnome/settings-daemon/plugins/media-keys/custom-keybindings/omadora-nightlight]
binding='<Super><Control>n'
command='omadora-menu toggle nightlight'
name='Toggle nightlight'

[org/gnome/settings-daemon/plugins/media-keys/custom-keybindings/omadora-idle]
binding='<Super><Control>i'
command='omadora-menu toggle idle'
name='Toggle stay awake'

[org/gnome/settings-daemon/plugins/media-keys/custom-keybindings/omadora-reminder-set]
binding='<Super><Control>r'
command='omadora-menu reminder'
name='Set reminder'

[org/gnome/settings-daemon/plugins/media-keys/custom-keybindings/omadora-reminder-show]
binding='<Super><Control><Alt>r'
command='omadora-menu reminder show'
name='Show reminders'

[org/gnome/settings-daemon/plugins/media-keys/custom-keybindings/omadora-reminder-clear]
binding='<Super><Control><Shift>r'
command='omadora-menu reminder clear'
name='Clear reminders'

[org/gnome/settings-daemon/plugins/media-keys/custom-keybindings/omadora-time]
binding='<Super><Control><Alt>t'
command='omadora-menu notice time'
name='Show time'

[org/gnome/settings-daemon/plugins/media-keys/custom-keybindings/omadora-battery]
binding='<Super><Control><Alt>b'
command='omadora-menu notice battery'
name='Show battery'

[org/gnome/settings-daemon/plugins/media-keys/custom-keybindings/omadora-terminal]
binding='<Super>Return'
command='ptyxis --new-window'
name='Terminal'

[org/gnome/settings-daemon/plugins/media-keys/custom-keybindings/omadora-browser]
binding='<Super><Shift>Return'
command='gtk-launch google-chrome'
name='Browser'

[org/gnome/settings-daemon/plugins/media-keys/custom-keybindings/omadora-files]
binding='<Super><Shift>f'
command='nautilus --new-window'
name='File manager'

[org/gnome/settings-daemon/plugins/media-keys/custom-keybindings/omadora-passwords]
binding='<Super><Shift>slash'
command='gtk-launch com.onepassword.OnePassword'
name='Password manager'

[org/gnome/settings-daemon/plugins/media-keys/custom-keybindings/omadora-agent]
binding='<Super><Control><Shift>a'
command='omadora-agent'
name='Agent'

[org/gnome/desktop/wm/keybindings]
close=['<Alt>F4', '<Super>w', '<Super>q']
toggle-fullscreen=['<Super>f']
switch-to-workspace-1=['<Super>Home', '<Super>1']
switch-to-workspace-2=['<Super>2']
switch-to-workspace-3=['<Super>3']
switch-to-workspace-4=['<Super>4']
move-to-workspace-1=['<Super><Shift>Home', '<Super><Shift>1']
move-to-workspace-2=['<Super><Shift>2']
move-to-workspace-3=['<Super><Shift>3']
move-to-workspace-4=['<Super><Shift>4']
switch-input-source=['XF86Keyboard']
switch-input-source-backward=['<Shift>XF86Keyboard']

[org/gnome/shell/keybindings]
switch-to-application-1=@as []
switch-to-application-2=@as []
switch-to-application-3=@as []
switch-to-application-4=@as []
show-screenshot-ui=['Print', '<Super><Control>c']

[org/gnome/mutter/wayland/keybindings]
restore-shortcuts=@as []

[org/gnome/mutter]
dynamic-workspaces=false

[org/gnome/desktop/wm/preferences]
num-workspaces=4
