# omarchy-mbp-2015: MacBookPro11,5. The panel is on the AMD Radeon, driven by the
# legacy 'radeon' driver, which has no atomic modesetting. Chromium's buffer
# handoff to the compositor corrupts under that path. This file is the right
# place for Arch electron* apps. Do not put the flag in a BROWSER flags file
# under ~/.config (chromium, chrome, brave, microsoft-edge-stable): Omarchy
# migrations overwrite those with 'cp -f'. Use /etc/chromium-flags.conf.
--disable-gpu-compositing
