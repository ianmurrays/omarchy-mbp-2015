# GTK4 defaults to the Vulkan renderer, but RADV refuses this GPU because the
# Radeon R9 M370X runs on the legacy `radeon` kernel driver, not amdgpu:
#   radv_physical_device.c: Device '/dev/dri/renderD128' is not using the
#   AMDGPU kernel driver: VK_ERROR_INCOMPATIBLE_DRIVER
# GTK4 then falls back to the *Intel* Vulkan driver (itself flagged by Mesa as
# "Haswell Vulkan support is incomplete"), so GTK4 apps render on the iGPU via
# reverse PRIME and hold /dev/dri/renderD129 open, preventing i915 runtime suspend.
# Forcing the GL renderer keeps them on radeonsi (renderD128).
# Revert: rm ~/.config/environment.d/90-gsk-renderer.conf
GSK_RENDERER=gl
