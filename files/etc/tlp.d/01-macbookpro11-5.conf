# MacBookPro11,5 (15" mid-2015) - battery tuning.
# The internal panel is driven by the AMD dGPU via radeon (radeon.si_support=1),
# so the dGPU can never be powered off - we can only make it idle cheaply.

# --- CPU ---------------------------------------------------------------
# scaling_driver is intel_cpufreq (pstate PASSIVE mode). In passive mode the
# generic "powersave" governor pins the CPU to its MINIMUM frequency, which is
# NOT what we want. schedutil is the correct choice here.
CPU_SCALING_GOVERNOR_ON_AC=schedutil
CPU_SCALING_GOVERNOR_ON_BAT=schedutil

# Haswell predates HWP, so this drives the legacy MSR. Harmless if ignored.
CPU_ENERGY_PERF_POLICY_ON_AC=balance_performance
CPU_ENERGY_PERF_POLICY_ON_BAT=power

# Turbo off on battery: the biggest single win on a 47 W quad-core Haswell.
CPU_BOOST_ON_AC=1
CPU_BOOST_ON_BAT=0

# --- Radeon dGPU DPM ---------------------------------------------------
RADEON_DPM_STATE_ON_AC=performance
RADEON_DPM_STATE_ON_BAT=battery
RADEON_DPM_PERF_LEVEL_ON_AC=auto
RADEON_DPM_PERF_LEVEL_ON_BAT=auto

# --- SATA link power management (was max_performance) ------------------
#SATA_LINKPWR_ON_AC=med_power_with_dipm
#SATA_LINKPWR_ON_BAT=med_power_with_dipm

# --- PCIe / runtime PM -------------------------------------------------
PCIE_ASPM_ON_AC=default
PCIE_ASPM_ON_BAT=powersave
RUNTIME_PM_ON_AC=auto
RUNTIME_PM_ON_BAT=auto

# --- Wi-Fi -------------------------------------------------------------
# Set WIFI_PWR_ON_BAT=off if you see Tailscale/SSH latency spikes.
WIFI_PWR_ON_AC=off
WIFI_PWR_ON_BAT=on

# --- USB ---------------------------------------------------------------
# 05ac:0274 is the internal keyboard/trackpad, 05ac:8290 the Bluetooth
# controller - autosuspending either makes input and BT audio stutter.
USB_AUTOSUSPEND=1
USB_DENYLIST="05ac:0274 05ac:8290"
USB_EXCLUDE_BTUSB=1

# --- power-saver profile (TLP 1.10 has performance/balanced/save; a desktop
# --- "Power Saver" setting maps to SAV, whose defaults override _ON_BAT)
# Forcing the GPU to "low" (300 MHz) showed no measurable power benefit on
# this machine, so use auto and keep the desktop responsive at 2880x1800.
RADEON_DPM_STATE_ON_SAV=battery
RADEON_DPM_PERF_LEVEL_ON_SAV=auto
CPU_SCALING_GOVERNOR_ON_SAV=schedutil
CPU_BOOST_ON_SAV=0
