KERNEL_CMDLINE[default]+=" radeon.si_support=1 amdgpu.si_support=0 modprobe.blacklist=amdgpu libata.force=noncq drm_kms_helper.poll=0"

# Intel VT-d rejects the discrete Radeon's DMA transfers with fault reason 0x0c
# ("non-zero reserved fields in PTE"), tens of thousands of faults per minute.
# The GPU cannot reliably read or write its own buffers, so the compositor
# renders a mostly blank frame. Fedora shipped with VT-d off, Arch enables it.
KERNEL_CMDLINE[default]+=" intel_iommu=off"
