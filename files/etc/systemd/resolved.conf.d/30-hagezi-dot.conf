# DNS over TLS for the HaGeZi resolvers.
#
# `omarchy dns Custom` writes plain IP addresses to /etc/systemd/resolved.conf
# and sets no DNSOverTLS= line, so DNS over TLS stays off. This drop-in adds
# the `address#hostname` form, which gives systemd-resolved the SNI name, and
# turns DNS over TLS on.
#
# systemd reads drop-ins after resolved.conf, so this file wins. The empty
# `DNS=` clears the list first, because systemd adds to a list setting instead
# of replacing it.
#
# CAUTION: this file also overrides a later `omarchy dns Cloudflare`,
# `omarchy dns Google` or `omarchy dns DHCP`. Delete this file before you
# change the DNS provider.
#
# `opportunistic` falls back to plain UDP if port 853 is blocked, which keeps
# captive portals usable. It authenticates no server.
#
# CAUTION: test before you change the value to `yes`. NetworkManager also gives
# systemd-resolved a per-link copy of these addresses with no name after `#`,
# and `yes` then validates the certificate against the IP address, which the
# HaGeZi certificate does not carry. That scope is expected to fail. Whether
# the query still succeeds through the global scope is untested. See
# docs/dns.md, "DNSOverTLS=yes can need one more step".
[Resolve]
DNS=
DNS=188.34.161.210#root.hagezi.org 2a01:4f8:c17:1c66::1#root.hagezi.org 159.69.155.94#wurzn.hagezi.org 2a01:4f8:1c1c:d363::1#wurzn.hagezi.org
DNSOverTLS=opportunistic
